<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Kiểm tra AI Gateway</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #fff; }
    .test { margin: 10px 0; padding: 10px; border: 1px solid #444; }
    .pass { background: #1a3d1a; border-color: #0f0; }
    .fail { background: #3d1a1a; border-color: #f00; }
    .testing { background: #3d3d1a; border-color: #ff0; }
    button { padding: 10px 20px; margin: 10px 0; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Kiểm tra AI Gateway</h1>
  <p>Trang này chỉ kiểm tra kết nối tới <code>/api/ai-proxy</code>. Key nhà cung cấp nằm trong gateway.</p>
  <button onclick="testAll()">Kiểm tra tất cả model</button>
  <div id="results"></div>

  <script type="module">
    import { AuthModule } from './modules/auth.js';

    const CASES = [
      { id: 'gemini', label: 'Gemini 3.5 Flash-Lite', payload: { provider: 'gemini', model: 'gemini-3.5-flash-lite', messages: [{ role: 'user', content: 'Trả lời 1 từ: OK' }] } },
      { id: 'groq', label: 'Groq GPT OSS 120B', payload: { provider: 'groq', model: 'openai/gpt-oss-120b', messages: [{ role: 'user', content: 'Trả lời 1 từ: OK' }] } },
      { id: 'openrouter', label: 'OpenRouter GPT-4o mini', payload: { provider: 'openrouter', model: 'openai/gpt-4o-mini', messages: [{ role: 'user', content: 'Trả lời 1 từ: OK' }] } }
    ];

    async function callProxy(payload) {
      const token = await AuthModule.getIdToken();
      if (!token) throw new Error('Chưa đăng nhập');
      const response = await fetch('/api/ai-proxy', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify(payload)
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.ok) throw new Error(data.message || `HTTP ${response.status}`);
      return data;
    }

    window.testAll = async function () {
      const results = document.getElementById('results');
      results.innerHTML = '';
      for (const item of CASES) {
        const el = document.createElement('div');
        el.className = 'test testing';
        el.textContent = `${item.label}: đang kiểm tra...`;
        results.appendChild(el);
        try {
          const data = await callProxy(item.payload);
          el.className = 'test pass';
          el.textContent = `${item.label}: OK — model ${data.model || '?'} — "${String(data.content || '').trim().slice(0, 60)}"`;
        } catch (error) {
          el.className = 'test fail';
          el.textContent = `${item.label}: LỖI — ${error.message}`;
        }
      }
    };
  </script>
</body>
</html>
